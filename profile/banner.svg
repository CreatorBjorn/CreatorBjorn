<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Bjorn — Unity, Next.js, local SEO">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151b"/>
      <stop offset="0.6" stop-color="#151319"/>
      <stop offset="1" stop-color="#1c1012"/>
    </linearGradient>
    <radialGradient id="forge" cx="0.16" cy="1.02" r="0.72">
      <stop offset="0" stop-color="#f08b3e" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#c04d1e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c04d1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.5" stop-color="#e0672f"/>
      <stop offset="1" stop-color="#e0672f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.74" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="meltdown">
      <rect width="1200" height="330" fill="url(#fadeout)"/>
    </mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <g mask="url(#meltdown)">
    <rect width="1200" height="330" fill="url(#ground)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <rect width="1200" height="330" fill="url(#forge)"/>

    <g fill="#f2903f">
      <circle cx="176" cy="300" r="2.2">
        <animate attributeName="cy" values="300;120" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="243" cy="300" r="1.6">
        <animate attributeName="cy" values="300;140" dur="9s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="312" cy="300" r="2.6">
        <animate attributeName="cy" values="300;150" dur="8s" begin="3.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="8s" begin="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="128" cy="300" r="1.4">
        <animate attributeName="cy" values="300;170" dur="10s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="10s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="381" cy="300" r="1.8">
        <animate attributeName="cy" values="300;160" dur="11s" begin="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="96" cy="300" r="2">
        <animate attributeName="cy" values="300;190" dur="12s" begin="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="12s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="86" y="138" fill="#f5f8fb"
          font-family="Verdana, DejaVu Sans, Geneva, sans-serif"
          font-size="72" font-weight="700" letter-spacing="10">BJORN</text>

    <rect x="90" y="164" width="196" height="3" rx="1.5" fill="url(#ember)"/>
    <rect x="90" y="164" width="34" height="3" rx="1.5" fill="#ffd9a8" opacity="0.85">
      <animate attributeName="x" values="90;252;90" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="88" y="206" fill="#a3b4c4"
          font-family="DejaVu Sans Mono, Consolas, Menlo, monospace"
          font-size="19" letter-spacing="5.5">UNITY · NEXT.JS · LOCAL SEO</text>

    <g stroke="#f0a05a" stroke-width="1.4" fill="none">
      <path d="M978 92 L1114 92" opacity="0.2"/>
      <path d="M978 120 L1062 120" opacity="0.14"/>
      <path d="M978 148 L1140 148" opacity="0.22">
        <animate attributeName="opacity" values="0.22;0.46;0.22" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <path d="M978 176 L1030 176" opacity="0.12"/>
      <path d="M978 204 L1098 204" opacity="0.18"/>
      <path d="M978 232 L1050 232" opacity="0.1"/>
    </g>
  </g>
</svg>
