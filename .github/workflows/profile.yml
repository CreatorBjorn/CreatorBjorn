name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile.yml"
      - "scripts/build_panel.py"
      - "profile/portrait.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Panel — character art and live numbers
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/build_panel.py

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            profile/snake-light.svg?palette=github-light
            profile/snake-dark.svg?palette=github-dark

      - name: 3D contribution graph (optional)
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile profile-3d-contrib 2>/dev/null || git add -A profile
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh profile"
          git push
